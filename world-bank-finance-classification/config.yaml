data:
  raw_path: "data/raw/indicators_long_view_November_11_2024.csv"
  processed_dir: "data/processed"

features:
  target: "fin16"
  selected:
    - "reg4"
    - "reg5"
    - "reg8"
    - "bus5"
    - "in11"
    - "in12"
    - "in16"
    - "cor11"
    - "crime9"
    - "tr9"
    - "wk9"
    - "wk10"
    - "infor2"
    - "fin14"
    - "fin11"
    - "fin20"
    - "perf1"
    - "perf2"

modeling:
  test_size: 0.3
  random_state: 42
  cv_folds: 5
  logistic_regression:
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    class_weight: "balanced"
  random_forest:
    n_estimators: 500
    class_weight: "balanced"
    oob_score: true
    random_state: 42
    max_features: "sqrt"

visualization:
  figure_size: [10, 6]
  dpi: 300
